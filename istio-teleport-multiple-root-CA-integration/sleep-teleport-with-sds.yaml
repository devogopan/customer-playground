apiVersion: v1
kind: ServiceAccount
metadata:
  name: sleep
  namespace: app-teleport
---
apiVersion: v1
kind: Service
metadata:
  name: sleep
  namespace: app-teleport
  labels:
    app: sleep
    service: sleep
spec:
  ports:
  - port: 80
    name: http
  selector:
    app: sleep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep
  namespace: app-teleport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleep
  template:
    metadata:
      labels:
        app: sleep
      annotations:
        inject.istio.io/templates: "sidecar"
        sidecar.istio.io/nativeSidecar: "false"
    spec:
      terminationGracePeriodSeconds: 0
      serviceAccountName: sleep
      initContainers:
        - name: sds-shim
          image: sds-shim:0.1.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always                    # native sidecar: runs for the pod's lifetime
          args:
            - -listen=/var/run/secrets/workload-spiffe-uds/socket
            - -upstream=/run/tbot-upstream/socket
          startupProbe:                            # istio-proxy starts only after this passes
            exec:
              command: ["/sds-shim", "-check=/var/run/secrets/workload-spiffe-uds/socket"]
            periodSeconds: 1
            failureThreshold: 30
          env:
            - name: GOMEMLIMIT                     # keep the Go GC well under the memory limit
              value: "24MiB"
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { memory: 32Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: workload-socket
              mountPath: /var/run/secrets/workload-spiffe-uds
            - name: tbot-upstream
              mountPath: /run/tbot-upstream
              readOnly: true
      containers:
      - name: sleep
        image: docker.io/curlimages/curl:8.16.0
        command: ["/bin/sleep", "infinity"]
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /etc/sleep/tls
          name: secret-volume
      volumes:
      - name: secret-volume
        secret:
          secretName: sleep-secret
          optional: true
      - name: tbot-upstream
        csi:
          driver: csi.spiffe.io
          readOnly: true
      - name: workload-socket
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
---
