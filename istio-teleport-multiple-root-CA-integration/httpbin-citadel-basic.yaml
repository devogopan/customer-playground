apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: app-citadel
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: app-citadel
  labels:
    app: httpbin
    service: httpbin
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 80
  selector:
    app: httpbin
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: app-citadel
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: httpbin
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        inject.istio.io/templates: sidecar
        sidecar.istio.io/nativeSidecar: "false"
      creationTimestamp: null
      labels:
        app: httpbin
    spec:
      containers:
      - image: kennethreitz/httpbin
        imagePullPolicy: Always
        name: httpbin
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: httpbin
      serviceAccountName: httpbin
      terminationGracePeriodSeconds: 30
      volumes:
      - csi:
          driver: csi.spiffe.io
          readOnly: true
        name: workload-socket
