apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: app-teleport
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: httpbin
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        inject.istio.io/templates: sidecar
        sidecar.istio.io/nativeSidecar: "false"
      creationTimestamp: null
      labels:
        app: httpbin
    spec:
      initContainers:
        - name: sds-shim
          image: sds-shim:0.1.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - -listen=/var/run/secrets/workload-spiffe-uds/socket
            - -upstream=/run/tbot-upstream/socket
          startupProbe:
            exec:
              command: ["/sds-shim", "-check=/var/run/secrets/workload-spiffe-uds/socket"]
            periodSeconds: 1
            failureThreshold: 30
          env:
            - name: GOMEMLIMIT
              value: "24MiB"
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { memory: 32Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: workload-socket
              mountPath: /var/run/secrets/workload-spiffe-uds
            - name: tbot-upstream
              mountPath: /run/tbot-upstream
              readOnly: true
      containers:
      - image: kennethreitz/httpbin
        imagePullPolicy: Always
        name: httpbin
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: httpbin
      serviceAccountName: httpbin
      terminationGracePeriodSeconds: 30
      volumes:
      - csi:
          driver: csi.spiffe.io
          readOnly: true
        name: tbot-upstream
      - name: workload-socket
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
