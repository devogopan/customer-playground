---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vs-route-validator
  namespace: infra-test-b
spec:
  schedule: "0 12,20 * * *"
  # Never start a run while the previous one is still going.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
          labels:
            app: vs-route-validator
        spec:
          serviceAccountName: vs-route-validator
          restartPolicy: Never
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          containers:
            - name: validator
              image: devogopan/validate-routes:v2.0.0-go
              imagePullPolicy: Always
              ports:
                - containerPort: 8000
                  name: metrics
              env:
                - name: SCRAPE_WAIT_SECONDS
                  value: "120"
              resources:
                requests:
                  cpu: "128m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              args:
                - "--concurrency"
                - "200"
